[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topontology"
version = "0.3.0"
description = "Topology measures for classified ontology graphs"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"

[project.scripts]
topontology = "topontology:main"

[tool.setuptools]
py-modules = ["topontology", "topology"]
